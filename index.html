<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amigo Secreto</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<div class="contenedor">
  <header>
    <h1>🎄 Amigo Secreto</h1>
    <p id="saludo">Las 6 familias</p>
    <div class="datos" id="datos"></div>
    <button class="salir oculto" id="btnSalir">Salir</button>
  </header>

  <!-- Entrada -->
  <section class="tarjeta" id="vistaEntrar">
    <h2>Entrar</h2>
    <form id="formEntrar">
      <label for="correo">Tu correo</label>
      <input id="correo" type="email" autocomplete="email" required>
      <label for="codigo">Tu código de 4 dígitos</label>
      <input id="codigo" inputmode="numeric" maxlength="4" required>
      <button type="submit">Entrar</button>
      <div class="error" id="errorEntrar"></div>
    </form>
  </section>

  <!-- Amigo secreto -->
  <section class="tarjeta oculto" id="vistaAmigo">
    <h2>Tu amigo secreto</h2>
    <div id="amigoSinSorteo" class="nota">El sorteo todavía no se hace. Mientras tanto, escribe tu carta 👇</div>
    <div id="amigoConSorteo" class="oculto">
      <p class="nota">Esto es lo que le gustaría recibir:</p>
      <ul class="opciones" id="amigoOpciones"></ul>
      <p id="amigoMensaje" class="nota"></p>
      <button id="btnRevelar">Revelar quién es</button>
      <div id="amigoNombre" class="revelado oculto"></div>
    </div>
  </section>

  <!-- Carta -->
  <section class="tarjeta oculto" id="vistaCarta">
    <h2>Mi carta</h2>
    <p class="nota">Escribe 3 opciones de regalo que te gustaría recibir. Quien te tocó las verá antes de saber tu nombre.</p>
    <form id="formCarta">
      <label for="op1">Opción 1</label>
      <input id="op1" maxlength="200" required>
      <label for="op2">Opción 2</label>
      <input id="op2" maxlength="200" required>
      <label for="op3">Opción 3</label>
      <input id="op3" maxlength="200" required>
      <label for="mensaje">Mensaje (opcional): talla, colores, gustos…</label>
      <textarea id="mensaje" maxlength="1000"></textarea>
      <button type="submit">Guardar mi carta</button>
      <div id="estadoCarta"></div>
    </form>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
let sesion = null;

function leerSesion() {
  try { return JSON.parse(localStorage.getItem('amigoSecreto')); } catch { return null; }
}
function guardarSesion(s) {
  try { s ? localStorage.setItem('amigoSecreto', JSON.stringify(s)) : localStorage.removeItem('amigoSecreto'); } catch {}
}
function mensajeError(e) {
  return (e && e.message ? e.message : String(e)).replace(/^.*?: /, '');
}
function quien(p) { return p.descripcion ? `${p.nombre}, ${p.descripcion}` : p.nombre; }

async function entrar(correo, codigo) {
  const { data, error } = await sb.rpc('entrar', { p_correo: correo, p_codigo: codigo });
  if (error) throw error;
  sesion = { correo, codigo };
  guardarSesion(sesion);
  mostrar(data);
}

function mostrar(yo) {
  $('vistaEntrar').classList.add('oculto');
  $('vistaCarta').classList.remove('oculto');
  $('vistaAmigo').classList.remove('oculto');
  $('btnSalir').classList.remove('oculto');
  $('saludo').textContent = `Hola, ${yo.nombre} 👋`;
  const datos = [];
  if (yo.monto) datos.push(`💰 ${yo.monto}`);
  if (yo.fecha) datos.push(`📅 ${yo.fecha}`);
  $('datos').innerHTML = datos.map(d => `<span></span>`).join('');
  [...$('datos').children].forEach((el, i) => el.textContent = datos[i]);
  $('op1').value = yo.opcion1 || '';
  $('op2').value = yo.opcion2 || '';
  $('op3').value = yo.opcion3 || '';
  $('mensaje').value = yo.mensaje || '';
  if (yo.sorteo_hecho) cargarAmigo();
}

async function cargarAmigo() {
  const { data, error } = await sb.rpc('mi_amigo', { p_correo: sesion.correo, p_codigo: sesion.codigo });
  if (error || !data) return;
  $('amigoSinSorteo').classList.add('oculto');
  $('amigoConSorteo').classList.remove('oculto');
  const ul = $('amigoOpciones');
  ul.innerHTML = '';
  const opciones = [data.opcion1, data.opcion2, data.opcion3].filter(Boolean);
  if (!opciones.length) {
    const li = document.createElement('li');
    li.textContent = 'Todavía no escribe su carta. Vuelve más tarde.';
    ul.appendChild(li);
  }
  opciones.forEach(o => { const li = document.createElement('li'); li.textContent = o; ul.appendChild(li); });
  $('amigoMensaje').textContent = data.mensaje ? `“${data.mensaje}”` : '';
  $('amigoNombre').innerHTML = '';
  $('amigoNombre').append(data.nombre);
  if (data.descripcion) { const s = document.createElement('small'); s.textContent = data.descripcion; $('amigoNombre').append(s); }
}

$('btnRevelar').onclick = () => {
  $('btnRevelar').classList.add('oculto');
  $('amigoNombre').classList.remove('oculto');
};

$('formEntrar').onsubmit = async e => {
  e.preventDefault();
  $('errorEntrar').textContent = '';
  try { await entrar($('correo').value, $('codigo').value); }
  catch (err) { $('errorEntrar').textContent = mensajeError(err); }
};

$('formCarta').onsubmit = async e => {
  e.preventDefault();
  const estado = $('estadoCarta');
  estado.className = ''; estado.textContent = 'Guardando…';
  const { error } = await sb.rpc('guardar_carta', {
    p_correo: sesion.correo, p_codigo: sesion.codigo,
    p_opcion1: $('op1').value, p_opcion2: $('op2').value, p_opcion3: $('op3').value,
    p_mensaje: $('mensaje').value,
  });
  if (error) { estado.className = 'error'; estado.textContent = mensajeError(error); }
  else { estado.className = 'ok'; estado.textContent = '¡Carta guardada! 🎁'; }
};

$('btnSalir').onclick = () => { guardarSesion(null); location.reload(); };

// Link directo con ?correo=...&codigo=... o sesión guardada.
const qs = new URLSearchParams(location.search);
const previa = leerSesion();
if (previa) entrar(previa.correo, previa.codigo).catch(() => guardarSesion(null));
else if (qs.get('correo')) $('correo').value = qs.get('correo');
</script>
</body>
</html>
